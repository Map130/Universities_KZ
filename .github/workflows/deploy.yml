name: Deploy to DigitalOcean

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          script: |
            mkdir -p ~/app
            cd ~/app
            
            # Клонируем или обновляем код
            if [ ! -d ".git" ]; then
              git clone https://oauth2:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git .
            else
              git reset --hard HEAD
              git pull origin main
            fi
            
            # Генерируем .env файл из секретов GitHub на лету
            echo "SURREAL_USER=${{ secrets.SURREAL_USER }}" > .env
            echo "SURREAL_PASS=${{ secrets.SURREAL_PASS }}" >> .env
            echo "SURREAL_NS=main" >> .env
            echo "SURREAL_DB=main" >> .env
            echo "DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}" >> .env
            echo "TLS_EMAIL=${{ secrets.TLS_EMAIL }}" >> .env
            echo "WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}" >> .env
            echo "GITHUB_TOKEN=${{ secrets.GH_PAT }}" >> .env
            echo "GITHUB_OWNER=${{ github.repository_owner }}" >> .env
            echo "GITHUB_REPO=${{ secrets.GITHUB_REPO }}" >> .env
            echo "GITHUB_BRANCH=main" >> .env
            
            # Перезапускаем сервисы
            docker compose down
            docker compose up -d --build
            
            # Чистим старые образы, чтобы не забивать диск дроплета
            docker image prune -f
