name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./cmd/api

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    env:
      SURREAL_URL: ws://localhost:8000/rpc
      SURREAL_USER: root
      SURREAL_PASS: root
      SURREAL_NS: test
      SURREAL_DB: test
      APP_PORT: "8080"
    steps:
      - uses: actions/checkout@v4

      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb \
            -p 8000:8000 \
            surrealdb/surrealdb:latest \
            start --log debug --user root --pass root memory

      - name: Wait for SurrealDB to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "SurrealDB is ready"
              exit 0
            fi
            echo "Waiting for SurrealDB... ($i/30)"
            sleep 1
          done
          echo "SurrealDB failed to start"
          docker logs surrealdb
          exit 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

  docker:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy .env for validation
        run: |
          cat <<EOF > .env
          SURREAL_USER=root
          SURREAL_PASS=root
          SURREAL_NS=test
          SURREAL_DB=test
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          APP_PORT=8080
          EOF

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
