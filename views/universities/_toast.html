{{define "_toast"}}
<div id="toast-container"
     hx-swap-oob="afterbegin:#toast-container">
    <div class="toast-enter rounded-lg p-4 shadow-lg border
        {{if eq .Type "success"}}bg-emerald-50 border-emerald-200 text-emerald-800{{end}}
        {{if eq .Type "error"}}bg-red-50 border-red-200 text-red-800{{end}}
        {{if eq .Type "warning"}}bg-amber-50 border-amber-200 text-amber-800{{end}}
        {{if eq .Type "info"}}bg-blue-50 border-blue-200 text-blue-800{{end}}"
        onclick="this.classList.remove('toast-enter'); this.classList.add('toast-exit'); setTimeout(function() { this.remove(); }.bind(this), 500);">
        <div class="flex items-start">
            {{if eq .Type "success"}}
            <svg class="h-5 w-5 mr-2 mt-0.5 flex-shrink-0 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {{end}}
            {{if eq .Type "error"}}
            <svg class="h-5 w-5 mr-2 mt-0.5 flex-shrink-0 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {{end}}
            {{if eq .Type "warning"}}
            <svg class="h-5 w-5 mr-2 mt-0.5 flex-shrink-0 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
            </svg>
            {{end}}
            {{if eq .Type "info"}}
            <svg class="h-5 w-5 mr-2 mt-0.5 flex-shrink-0 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {{end}}
            <p class="text-sm font-medium">{{.Message}}</p>
        </div>
    </div>
</div>
<script>
    // Auto-dismiss toast after 5 seconds.
    (function() {
        var container = document.getElementById('toast-container');
        if (!container) return;
        var toast = container.firstElementChild;
        if (!toast) return;
        setTimeout(function() {
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-exit');
            setTimeout(function() { toast.remove(); }, 500);
        }, 5000);
    })();
</script>
{{end}}
