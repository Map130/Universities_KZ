{{define "content"}}
<div class="px-4 sm:px-6 lg:px-8 py-8">
    <div class="max-w-2xl mx-auto text-center py-16">
        <!-- Icon -->
        <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-2xl bg-indigo-50 mb-6">
            <svg class="h-10 w-10 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                      d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
            </svg>
        </div>

        <!-- Title -->
        <h1 class="text-2xl font-bold text-gray-900 mb-2">
            {{with .Content}}{{.Title}}{{end}}
        </h1>

        <!-- Description -->
        <p class="text-gray-500 mb-8 max-w-md mx-auto">
            {{with .Content}}{{.Description}}{{end}}
        </p>

        <!-- Status Badge -->
        <span class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200">
            <svg class="mr-1.5 h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            В разработке
        </span>

        <!-- Back Link -->
        <div class="mt-10">
            <a href="/admin/universities"
               hx-get="/admin/universities"
               hx-target="#main-content"
               hx-push-url="true"
               class="inline-flex items-center text-sm font-medium text-indigo-600 hover:text-indigo-800 transition-colors duration-150">
                <svg class="mr-1.5 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Перейти к вузам
            </a>
        </div>
    </div>
</div>
{{end}}
