#:schema https://json.schemastore.org/any.json

# ─────────────────────────────────────────────────────────────
#  Air — Live Reload для Go + Tailwind CSS
#
#  Что происходит при изменении файла:
#    1. pre_cmd  → npx tailwindcss пересобирает CSS
#    2. cmd      → go build компилирует бинарник
#    3. bin      → запускается ./tmp/main
#
#  Tailwind watch НЕ нужен отдельно — air сам триггерит
#  пересборку CSS при изменении .html / .go файлов.
# ─────────────────────────────────────────────────────────────

env_files = [".env"]
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # ── 1. Пересборка Tailwind CSS перед компиляцией Go ────────
  pre_cmd = ["find ./static -name '*.fiber.gz' -delete", "npx tailwindcss -i ./static/css/input.css -o ./static/css/output.css --minify"]

  # ── 2. Компиляция Go (noauth для dev без Google OAuth) ─────
  cmd = "go build -tags noauth -o ./tmp/main ./cmd/api"

  # ── 3. Запуск бинарника ────────────────────────────────────
  bin = "./tmp/main"
  args_bin = []
  full_bin = ""

  # ── Какие директории отслеживать ───────────────────────────
  # views   — HTML-шаблоны (layout, universities/*, stub)
  # static  — CSS input, картинки, JS
  # cmd     — main.go, точка входа
  # internal— handlers, models, repo, auth, storage
  # configs — конфиги (пока пусто, но пусть следит)
  include_dir = ["cmd", "internal", "configs", "views", "static"]

  # ── Какие расширения триггерят rebuild ─────────────────────
  include_ext = ["go", "html", "css", "js", "tmpl", "tpl", "surql"]
  include_file = ["tailwind.config.js"]

  # ── Что исключить ─────────────────────────────────────────
  # output.css — результат сборки Tailwind, не нужно зацикливаться
  # node_modules — npm пакеты, не наш код
  # tmp — артефакты билда air
  # .git — понятно
  exclude_dir = ["tmp", "vendor", "testdata", "node_modules", ".git"]
  exclude_file = ["static/css/output.css"]
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = false

  # ── Timing ─────────────────────────────────────────────────
  # Задержка перед билдом после детекта изменений (мс).
  # 500ms — достаточно чтобы IDE успел записать все файлы,
  # но не слишком долго чтобы раздражать.
  delay = 500
  rerun = false
  rerun_delay = 500

  # ── Post-build (пусто, но можно добавить уведомления) ──────
  post_cmd = []

  # ── Misc ───────────────────────────────────────────────────
  follow_symlink = false
  ignore_dangerous_root_dir = false
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = true

[misc]
  clean_on_exit = true

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = true
  keep_scroll = true
